name: PR Governance & Conventional Commits

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

jobs:
  validate-pr-title:
    name: Conventional Commits Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Title Regex
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            statsfirm
            agrostats
            holding
            governance
            bpmn
            lakehouse
            ui
            deps
          requireScope: true
