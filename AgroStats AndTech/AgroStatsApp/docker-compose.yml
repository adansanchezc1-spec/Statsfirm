version: '3.8'

services:
  agrostats-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrostats_enterprise_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DUCKDB_DATABASE_PATH=/app/data/gold/agrostats_gold.duckdb
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agrostats-net

  agrostats-web:
    image: nginx:alpine
    container_name: agrostats_enterprise_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - agrostats-api
    networks:
      - agrostats-net

networks:
  agrostats-net:
    driver: bridge
