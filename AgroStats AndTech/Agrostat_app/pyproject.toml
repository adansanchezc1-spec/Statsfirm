[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agrostat-app"
version = "1.0.0"
description = "Hexagonal Architecture Data Science & Data Engineering Platform for Agricultural Yield Forecasting and Statistical Process Control."
readme = "README.md"
authors = [
    { name = "AgroStats & Tech Engineering Team", email = "engineering@agrostats.statsfirm.com" }
]
requires-python = ">=3.10"
keywords = ["hexagonal-architecture", "data-science", "data-engineering", "spc", "shewhart", "machine-learning", "lakehouse"]
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",
    "duckdb>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "flake8>=6.1.0",
    "black>=23.9.0",
]

[project.scripts]
agrostat = "agrostat_app.adapters.driving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
