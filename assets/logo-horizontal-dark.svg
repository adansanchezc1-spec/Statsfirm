<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none" role="img" aria-label="Agro Stat & Tech Co. Logo Dark">
  <defs>
    <linearGradient id="leafGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="nodeGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISOTIPO GROUP -->
  <g transform="translate(6, 6) scale(0.8)">
    <line x1="8" y1="88" x2="92" y2="88" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M 12 88 C 28 88, 36 78, 43 56 C 47 42, 50 36, 50 36 C 50 36, 53 42, 57 56 C 64 78, 72 88, 88 88" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 50 56 C 36 50, 24 64, 30 76 C 42 76, 48 64, 50 56 Z" 
          fill="url(#leafGradDark)" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 50 56 C 64 50, 76 64, 70 76 C 58 76, 52 64, 50 56 Z" 
          fill="url(#leafGradDark)" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 50 88 L 50 28" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="24" r="8" fill="#10B981" filter="url(#nodeGlowDark)"/>
    <circle cx="50" cy="24" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <text x="96" y="47" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">AGRO STAT</text>
        
  <text x="98" y="72" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" font-weight="600" fill="#10B981" letter-spacing="4">&amp; TECH CO.</text>
        
  <rect x="238" y="60" width="124" height="15" rx="3" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
  <text x="244" y="71" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#34D399" letter-spacing="0.5">SPIN-OFF STATSFIRM</text>
</svg>
